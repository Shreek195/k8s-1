apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
specs:
  replicas: 2
  selector:
    matchLabels:
      app: flask-web
    template:
      metadata:
        labels:
          app: flask-web
      specs:
        containers:
          - name: flask-containers
            image: shreek195/flask-app:v1
            ports:
              - containerPort: 6000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask-web
  ports:
    - ports: 6000
      targetPort: 6000
      nodePort: 30006
